name: release

# Every push to main or to a work-in-progress branch, and on demand. A pull
# request never starts this workflow, because every run publishes images.
#
# The images are signed as "this workflow, on the ref it ran on", and only
# the identity of a run on main is to be trusted. So a run on main makes a
# release and a run anywhere else is a rehearsal: the same jobs, checked
# against the identity of its own ref, which nothing trusts.
on:
  push:
    branches:
      - main
      - "wip/**"
  workflow_dispatch:

# What a job gets unless it asks for more. Only the two jobs that write to
# the registry ask, and each says why.
permissions:
  contents: read

# A newer push to the same ref supersedes the run already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Naming bash explicitly makes every script run with -e and -o pipefail.
defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/shubhroses/signed-image-pipeline
  # Images that must be refused, kept out of the package that holds releases.
  FIXTURES: ghcr.io/shubhroses/signed-image-pipeline-fixtures
  # The one signer to trust: this workflow, run on main. Sigstore writes the
  # workflow and the ref of the run that asked into the signing certificate,
  # on the word of the issuer, which is GitHub's token service.
  TRUSTED_IDENTITY: https://github.com/shubhroses/signed-image-pipeline/.github/workflows/release.yml@refs/heads/main
  ISSUER: https://token.actions.githubusercontent.com

jobs:
  # The same check as in ci.yml. This workflow does not wait for that one, so
  # it asks for itself: the gate below must not accept a finding on the
  # strength of an exception that has no reason or no valid expiry date.
  exceptions:
    name: scan exceptions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13" # the Python the lock was resolved for

      - name: Install the locked dev dependencies
        run: |
          python -m pip install --require-hashes \
            --requirement app/requirements-dev.txt

      - name: Check every exception has a reason and expires within 90 days
        run: python scripts/check_scan_exceptions.py .trivyignore.yaml

  build:
    name: build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # to push to GHCR
    outputs:
      # Each is a complete reference, NAME@sha256:DIGEST. Later jobs use these
      # and never a tag, so they all act on exactly what was built here.
      image: ${{ steps.push.outputs.image }}
      fixture-unsigned: ${{ steps.push.outputs.fixture-unsigned }}
      fixture-wrong-signer: ${{ steps.push.outputs.fixture-wrong-signer }}
      fixture-no-sbom: ${{ steps.push.outputs.fixture-no-sbom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker can attach a build attestation to an image, and then pushes an
      # index that holds the two. Without one it pushes a single image
      # manifest, so the digest recorded below is the digest of the image.
      - name: Build the image
        run: |
          docker build --provenance=false \
            --build-arg "REVISION=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" .

      # Each fixture is the image above with one more label. The label gives
      # it a digest of its own, so that whatever is later attached to one
      # digest says nothing about another, and it leaves the content the same,
      # so that the only reason to refuse a fixture is how it was signed.
      # The sign job leaves one unsigned and signs the other two, each short
      # of a release in its own way.
      - name: Build the negative fixtures
        run: |
          for fixture in unsigned wrong-signer no-sbom; do
            docker build --quiet --provenance=false \
              --build-arg "REVISION=$GITHUB_SHA" \
              --label "org.opencontainers.image.description=Negative test fixture ($fixture). Not a release: the admission policy must refuse it." \
              --tag "$FIXTURES:$fixture-$GITHUB_SHA" .
          done

      # After the builds, so that the token is not on disk while the
      # Dockerfile runs.
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"

      - name: Push the images and record their digests
        id: push
        run: |
          # $1 is the name of a job output and $2 the tag to push. Docker
          # records the digest of what it pushed under RepoDigests.
          push() {
            python3 scripts/retry.py docker push --quiet "$2"
            reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$2")"
            echo "$1=$reference" | tee -a "$GITHUB_OUTPUT"
          }
          push image "$IMAGE:$GITHUB_SHA"
          for fixture in unsigned wrong-signer no-sbom; do
            push "fixture-$fixture" "$FIXTURES:$fixture-$GITHUB_SHA"
          done

      - name: Summarise
        env:
          RELEASE: ${{ steps.push.outputs.image }}
          UNSIGNED: ${{ steps.push.outputs.fixture-unsigned }}
          WRONG_SIGNER: ${{ steps.push.outputs.fixture-wrong-signer }}
          NO_SBOM: ${{ steps.push.outputs.fixture-no-sbom }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Images

          Built from commit \`$GITHUB_SHA\` and pushed to GHCR.

          | Image | Reference |
          |---|---|
          | Release | \`$RELEASE\` |
          | Fixture: unsigned | \`$UNSIGNED\` |
          | Fixture: wrong signer | \`$WRONG_SIGNER\` |
          | Fixture: no SBOM | \`$NO_SBOM\` |
          EOF

  # Whoever uses these images arrives without credentials: a cluster that
  # pulls one, or a reader who checks one. A new GHCR package can start out
  # private, and a private image fails every later check for the wrong
  # reason, because nobody can read it. A fixture has to be refused for how
  # it was signed, so each image is first shown to be readable by anyone,
  # and the rest of the workflow waits for that.
  pull:
    name: anonymous pull
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE: ${{ needs.build.outputs.image }}
      UNSIGNED: ${{ needs.build.outputs.fixture-unsigned }}
      WRONG_SIGNER: ${{ needs.build.outputs.fixture-wrong-signer }}
      NO_SBOM: ${{ needs.build.outputs.fixture-no-sbom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker reads its logins from its configuration directory. Pointed at
      # an empty one, it has no credentials to send.
      - name: Pull every image by digest without credentials
        run: |
          mkdir "$RUNNER_TEMP/no-credentials"
          for reference in "$RELEASE" "$UNSIGNED" "$WRONG_SIGNER" "$NO_SBOM"; do
            python3 scripts/retry.py \
              docker --config "$RUNNER_TEMP/no-credentials" pull --quiet "$reference"
          done

  # Trivy runs from a pinned image and reads the released image from the
  # registry by digest, without credentials. The job has a read-only token
  # and nothing is mounted into the scanner but the exceptions file and a
  # cache, which carries the vulnerability database from step to step.
  scan:
    name: sbom and gate
    needs: [build, pull, exceptions]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load the pinned tool images
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"

      # Downloaded once, so that the totals and the gate below are both
      # answers from the same database.
      - name: Download the vulnerability database
        run: |
          python3 scripts/retry.py docker run --rm \
            --volume trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image --download-db-only --no-progress

      - name: Write the SBOM
        run: |
          docker run --rm \
            --volume trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image --image-src remote --no-progress \
            --format spdx-json "$RELEASE" > "$RUNNER_TEMP/sbom.spdx.json"

      # No severity filter and no --ignore-unfixed here: this report is what
      # the summary counts, and it counts what the gate does not act on too.
      - name: List every finding, with or without a fix
        run: |
          docker run --rm \
            --volume trivy-cache:/root/.cache/trivy \
            --volume "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
            "$TRIVY_IMAGE" image --image-src remote --no-progress \
            --skip-db-update \
            --ignorefile /.trivyignore.yaml --show-suppressed \
            --format json "$RELEASE" > "$RUNNER_TEMP/scan.json"

      # Written before the gate, so that a run the gate stops still shows
      # what was found. "With a fix" is Trivy's status "fixed", which is
      # what --ignore-unfixed keeps.
      - name: Summarise
        run: |
          {
            echo "### SBOM and scan"
            echo
            echo "- Image: \`$RELEASE\`"
            jq --raw-output '
              [.packages[] | select(.primaryPackagePurpose == "LIBRARY")] as $libraries
              | [$libraries[].externalRefs[]? | select(.referenceType == "purl")
                 | .referenceLocator | ltrimstr("pkg:") | split("/")[0]] as $types
              | ($types | group_by(.) | map("\(length) \(.[0])") | join(", ")) as $by_type
              | "- SBOM: \($libraries | length) packages (\($by_type))"
            ' "$RUNNER_TEMP/sbom.spdx.json"
            docker run --rm --volume trivy-cache:/root/.cache/trivy \
              "$TRIVY_IMAGE" version --format json | jq --raw-output '
              "- Scanner: Trivy \(.Version), vulnerability database updated "
              + .VulnerabilityDB.UpdatedAt[0:19] + "Z"
            '
            jq --raw-output '
              [.Results[]?.Vulnerabilities[]?] as $found
              | "- Findings accepted in .trivyignore.yaml: "
                + ([.Results[]?.ExperimentalModifiedFindings[]?] | length | tostring),
                "- Secrets found in the image: "
                + ([.Results[]?.Secrets[]?] | length | tostring),
                "",
                "| Severity | Findings | With a fix |",
                "|---|---|---|",
                (("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN") as $severity
                 | [$found[] | select(.Severity == $severity)]
                 | "| \($severity) | \(length) | \(map(select(.Status == "fixed")) | length) |")
            ' "$RUNNER_TEMP/scan.json"
            echo
            echo "The gate fails on a High or Critical vulnerability that has a" \
              "fix and on a High or Critical secret, unless \`.trivyignore.yaml\`" \
              "accepts the finding. A vulnerability with no fix does not fail" \
              "it, so passing the gate does not mean that none is known."
          } >> "$GITHUB_STEP_SUMMARY"

      # The gate of ci.yml with the same flags, asked about the image that
      # was pushed. When it fails the job stops here: the SBOM is not kept and
      # no job that needs this one runs.
      - name: Fail on fixable High or Critical vulnerabilities
        run: |
          docker run --rm \
            --volume trivy-cache:/root/.cache/trivy \
            --volume "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
            "$TRIVY_IMAGE" image --image-src remote --no-progress \
            --skip-db-update \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore.yaml --show-suppressed "$RELEASE"

      - name: Keep the SBOM with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.spdx.json
          if-no-files-found: error

  # Reached only when the scan job has passed: the exceptions are in order,
  # every image can be read by anyone and the gate found nothing it fails on.
  # So a signature made here says "built by this workflow, and it passed the
  # gate". It does not say the image is safe.
  #
  # No key is stored anywhere. For each signature cosign asks GitHub for a
  # short-lived token that names this workflow and the ref it runs on, and
  # shows it to Sigstore's certificate authority, which issues a certificate
  # that lasts ten minutes for a key made for that one command. The signed
  # statement, the certificate and the proof that Sigstore's public log has
  # recorded them go into GHCR next to the image, and the key is forgotten.
  sign:
    name: sign and attest
    needs: [build, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # to ask GitHub for the token that says who is signing
      packages: write # cosign stores what it signs in GHCR, next to the image
    env:
      RELEASE: ${{ needs.build.outputs.image }}
      NO_SBOM: ${{ needs.build.outputs.fixture-no-sbom }}
      WRONG_SIGNER: ${{ needs.build.outputs.fixture-wrong-signer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scripts/cosign.sh runs the pinned cosign with one directory as its
      # home and working directory. A file named without a path in the steps
      # below is in that directory.
      - name: Load the pinned tool images and name a directory for cosign
        run: |
          grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
          echo "COSIGN_HOME=$RUNNER_TEMP/cosign" >> "$GITHUB_ENV"

      # The SBOM the scan job wrote from the image. That job keeps it only
      # when the gate has passed.
      - name: Fetch the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/cosign

      - name: Fetch cosign
        run: python3 scripts/retry.py docker pull --quiet "$COSIGN_IMAGE"

      - name: Log cosign in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/cosign.sh login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"

      # --yes answers the question cosign would ask first: whether the
      # identity may be recorded in a public log, for good. --bundle writes
      # what goes into the registry to a file as well, for the summary below.
      - name: Sign the image
        run: |
          python3 scripts/retry.py scripts/cosign.sh sign --yes \
            --bundle release-signature.json "$RELEASE"

      # An attestation is a signed statement about the image: here, that this
      # SBOM describes it. It is made and stored the way the signature is.
      - name: Attest the SBOM
        run: |
          python3 scripts/retry.py scripts/cosign.sh attest --yes \
            --type spdxjson --predicate sbom.spdx.json \
            --bundle release-attestation.json "$RELEASE"

      # Signed like a release and given no SBOM: the fixture that must be
      # refused for the missing attestation alone.
      - name: Sign the no-SBOM fixture
        run: |
          python3 scripts/retry.py scripts/cosign.sh sign --yes \
            --bundle no-sbom-signature.json "$NO_SBOM"

      # The only key in this project. It is made here, signs the one fixture
      # and is deleted when the step ends, however the step ends. It has no
      # password because nothing trusts it: there is nothing to protect. The
      # last command checks the fixture against the public half, so that it is
      # known to carry a sound signature whose only fault is who made it.
      - name: Sign the wrong-signer fixture with a throwaway key
        env:
          COSIGN_PASSWORD: ""
        run: |
          trap 'rm -f "$COSIGN_HOME/throwaway.key"' EXIT
          scripts/cosign.sh generate-key-pair --output-key-prefix throwaway
          python3 scripts/retry.py scripts/cosign.sh sign --yes --key throwaway.key \
            --bundle wrong-signer-signature.json "$WRONG_SIGNER"
          python3 scripts/retry.py scripts/cosign.sh verify --key throwaway.pub "$WRONG_SIGNER"

      - name: Check the throwaway key is gone
        run: test ! -e "$COSIGN_HOME/throwaway.key"

      # Read from what cosign stored, not from what this workflow expects:
      # the identity is the one in each certificate, and the log entry is the
      # one each bundle carries the proof of. Each value is assigned before it
      # is used, so that a bundle without one stops the step.
      - name: Summarise
        run: |
          # The identity in the certificate of a bundle.
          signer() {
            jq --raw-output --exit-status '.verificationMaterial.certificate.rawBytes' "$COSIGN_HOME/$1" \
              | base64 --decode \
              | openssl x509 -inform DER -noout -ext subjectAltName \
              | grep URI: | sed 's/^ *URI://'
          }
          # A link to the entry Sigstore's log made for a bundle.
          log_entry() {
            jq --raw-output '
              .verificationMaterial.tlogEntries[0].logIndex // error("no log entry")
              | "[\(.)](https://search.sigstore.dev/?logIndex=\(.))"
            ' "$COSIGN_HOME/$1"
          }
          release_signer="$(signer release-signature.json)"
          release_entry="$(log_entry release-signature.json)"
          sbom_signer="$(signer release-attestation.json)"
          sbom_entry="$(log_entry release-attestation.json)"
          no_sbom_signer="$(signer no-sbom-signature.json)"
          no_sbom_entry="$(log_entry no-sbom-signature.json)"
          wrong_signer_entry="$(log_entry wrong-signer-signature.json)"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Signatures

          Made after the gate passed, with no stored key. "Signed as" is the
          identity in the certificate Sigstore issued for that signature. The
          only one to trust is \`$TRUSTED_IDENTITY\`.

          | Signed | Signed as | Transparency log entry |
          |---|---|---|
          | Release image | \`$release_signer\` | $release_entry |
          | SBOM attestation for the release image | \`$sbom_signer\` | $sbom_entry |
          | Fixture: no SBOM | \`$no_sbom_signer\` | $no_sbom_entry |
          | Fixture: wrong signer | a key made and deleted in this job | $wrong_signer_entry |
          EOF

  # The checks a stranger can make: no login, no token and no key, only the
  # public registry and the identity to expect. What must pass is tried
  # again if it fails, because cosign cannot be talked into finding a
  # signature that is not there. What must fail is asked once, and has to
  # fail in cosign's own words for that case (scripts/expect_failure.py).
  verify:
    name: verify
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE: ${{ needs.build.outputs.image }}
      UNSIGNED: ${{ needs.build.outputs.fixture-unsigned }}
      WRONG_SIGNER: ${{ needs.build.outputs.fixture-wrong-signer }}
      NO_SBOM: ${{ needs.build.outputs.fixture-no-sbom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load the pinned tool images and name a directory for cosign
        run: |
          grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
          echo "COSIGN_HOME=$RUNNER_TEMP/cosign" >> "$GITHUB_ENV"

      - name: Fetch cosign
        run: python3 scripts/retry.py docker pull --quiet "$COSIGN_IMAGE"

      # On main the images must be signed as the trusted identity, spelt out
      # above. A run on any other ref cannot have that identity: its
      # certificates name its own ref. It is checked against that instead, so
      # that every step below is rehearsed before it runs on main.
      - name: Choose the identity to expect
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            identity="$TRUSTED_IDENTITY"
            kind="A release"
          else
            identity="https://github.com/$GITHUB_WORKFLOW_REF"
            kind="A rehearsal on \`$GITHUB_REF\`, whose identity nothing trusts"
          fi
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Verification

          $kind. Checked without a login or a key, as any reader can.

          - Image: \`$RELEASE\`
          - Signer asked for: \`$identity\`
          - Issuer asked for: \`$ISSUER\`
          EOF

      # The Makefile names the trusted identity itself, so on main this is
      # the command a reader runs. A rehearsal has to say whom to expect.
      - name: Run the check any reader can run
        run: |
          if [ "$IDENTITY" = "$TRUSTED_IDENTITY" ]; then
            python3 scripts/retry.py make verify RELEASE="$RELEASE"
          else
            python3 scripts/retry.py make verify RELEASE="$RELEASE" IDENTITY="$IDENTITY"
          fi

      # "cosign verify" accepts any statement about the image that the
      # identity signed, an SBOM attestation as much as a signature. So its
      # answer is read too: one of the statements must be the signature.
      - name: Check the image carries the workflow's signature
        run: |
          python3 scripts/retry.py scripts/cosign.sh --output-file signed.json verify \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$RELEASE"
          jq --exit-status 'any(.[]; .critical.type == "https://sigstore.dev/cosign/sign/v1")' \
            "$COSIGN_HOME/signed.json"

      # cosign prints one line for each attestation it verified: a signed
      # envelope around a statement whose predicate is the SBOM. A retried
      # "cosign attest" can leave two, and then they must hold the same SBOM.
      - name: Fetch the SBOM the workflow attested
        run: |
          python3 scripts/retry.py scripts/cosign.sh --output-file attested.jsonl verify-attestation \
            --type spdxjson \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$RELEASE"
          jq --slurp '
            map(.payload | @base64d | fromjson | .predicate) | unique
            | if length == 1 then .[0] else error("expected one attested SBOM, found \(length)") end
          ' "$COSIGN_HOME/attested.jsonl" > "$RUNNER_TEMP/attested-sbom.json"

      # The SBOM has to be the one made from this image, and the image has to
      # hold what the lock says: each package requirements.in asks for, at the
      # version requirements.txt pins.
      - name: Check the attested SBOM against the image and the lock
        run: |
          jq --exit-status --arg release "$RELEASE" '.name == $release' \
            "$RUNNER_TEMP/attested-sbom.json"
          python3 scripts/check_sbom_dependencies.py \
            app/requirements.in app/requirements.txt "$RUNNER_TEMP/attested-sbom.json" \
            | tee "$RUNNER_TEMP/dependencies.txt"
          {
            jq --raw-output '
              [.packages[] | select(.primaryPackagePurpose == "LIBRARY")] | length
              | "- Attested SBOM: \(.) packages, with each direct dependency at its locked version:"
            ' "$RUNNER_TEMP/attested-sbom.json"
            sed 's/^/  - /' "$RUNNER_TEMP/dependencies.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      # Each fixture falls short of a release in one way, and the same two
      # commands have to say so. cosign says of an image that does not exist
      # what it says of an unsigned one, which is why this job comes after the
      # pull job: that job has shown that every one of these can be read.
      - name: Check each fixture is refused
        run: |
          signer=(--certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER")
          verify=(scripts/cosign.sh verify "${signer[@]}")
          verify_sbom=(scripts/cosign.sh verify-attestation --type spdxjson "${signer[@]}")
          # Followed by what cosign has to say and then by what to ask it,
          # this prints the line in which cosign said it.
          expect_refusal=(python3 scripts/expect_failure.py)

          # One row of the table: the image, then the answer to each command.
          row() {
            printf '| %s | %s | %s |\n' "$@" >> "$GITHUB_STEP_SUMMARY"
          }
          echo >> "$GITHUB_STEP_SUMMARY"
          row "Image" "\`cosign verify\`" "\`cosign verify-attestation --type spdxjson\`"
          row "---" "---" "---"
          # A step runs only when those before it have passed, and they asked
          # both questions about the release.
          row "Release" "passes" "passes"

          # Nothing is attached to it.
          signature="$("${expect_refusal[@]}" "no signatures found" "${verify[@]}" "$UNSIGNED")"
          sbom="$("${expect_refusal[@]}" "no matching attestations" "${verify_sbom[@]}" "$UNSIGNED")"
          row "Fixture: unsigned" "fails: \`$signature\`" "fails: \`$sbom\`"

          # Its one signature is sound and is in the log, but a key made it
          # and not a certificate that names the identity.
          words="transparency log certificate does not match"
          signature="$("${expect_refusal[@]}" "$words" "${verify[@]}" "$WRONG_SIGNER")"
          sbom="$("${expect_refusal[@]}" "$words" "${verify_sbom[@]}" "$WRONG_SIGNER")"
          row "Fixture: wrong signer" "fails: \`$signature\`" "fails: \`$sbom\`"

          # Signed by the identity, so the first command has to pass: that is
          # what leaves the missing SBOM as the only reason to refuse it.
          python3 scripts/retry.py "${verify[@]}" "$NO_SBOM" > /dev/null
          words="none of the attestations matched the predicate type: spdxjson"
          sbom="$("${expect_refusal[@]}" "$words" "${verify_sbom[@]}" "$NO_SBOM")"
          row "Fixture: no SBOM" "passes" "fails: \`$sbom\`"

      # What keeps a branch from making a release. This image was signed on
      # another ref, so the trusted identity must not accept it, and cosign
      # names both identities when it refuses.
      - name: Check the trusted identity refuses a rehearsal
        if: github.ref != 'refs/heads/main'
        run: |
          refusal="$(python3 scripts/expect_failure.py \
            "expected SAN value \"$TRUSTED_IDENTITY\", got \"$IDENTITY\"" \
            scripts/cosign.sh verify \
            --certificate-identity "$TRUSTED_IDENTITY" --certificate-oidc-issuer "$ISSUER" "$RELEASE")"
          {
            echo
            echo "Asked for the trusted identity instead, \`cosign verify\` refuses this image:"
            echo
            echo "    $refusal"
          } >> "$GITHUB_STEP_SUMMARY"

  # What a cluster makes of the release. A kind cluster gets Kyverno at the
  # pinned version, then the namespace and the two policies of policy/, and
  # is offered eight workloads: two it has to accept and six it has to
  # refuse, each for a stated reason (scripts/admission_cases.sh).
  #
  # The job has a read-only token and logs in nowhere. The cluster pulls the
  # images, and Kyverno reads what is attached to them, as anybody can. Each
  # step is a target of the Makefile, so that "make admission" does the same.
  admission:
    name: admission
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE: ${{ needs.build.outputs.image }}
      UNSIGNED: ${{ needs.build.outputs.fixture-unsigned }}
      WRONG_SIGNER: ${{ needs.build.outputs.fixture-wrong-signer }}
      NO_SBOM: ${{ needs.build.outputs.fixture-no-sbom }}
      # Where the Makefile has kind write the credentials of the test cluster,
      # which is the only cluster in the file. The steps that call kubectl or
      # helm themselves read it too.
      KUBECONFIG: ${{ github.workspace }}/.cache/kubeconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start a kind cluster and install Kyverno
        run: make admission-cluster

      # kubectl supports a cluster one minor version away from its own, and
      # the runner's is further than that from the Kubernetes this test pins.
      # The node image holds the kubectl of its own version, so the steps
      # below use that one: client and cluster come from the same pinned image.
      - name: Take kubectl from the node, at the version of the cluster
        run: |
          mkdir "$RUNNER_TEMP/bin"
          docker cp signed-image-pipeline-control-plane:/usr/bin/kubectl "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # On main the policies are the files in policy/, untouched, so the image
      # policy trusts the release workflow on main and nobody else.
      - name: Apply the namespace and the policies exactly as committed
        if: github.ref == 'refs/heads/main'
        run: make admission-policy

      # A run on another ref cannot sign as main: its images carry the
      # identity of its own ref. So that the cases can be rehearsed before
      # they run on main, the cluster of a rehearsal gets a copy of the
      # policies in which that identity stands where the trusted one stood.
      # Nothing else differs, and the copy is never used on main.
      - name: Apply them with the identity of this ref as the one to trust
        if: github.ref != 'refs/heads/main'
        run: |
          rehearsal="https://github.com/$GITHUB_WORKFLOW_REF"
          mkdir "$RUNNER_TEMP/policy"
          cp policy/*.yaml "$RUNNER_TEMP/policy/"
          sed --in-place "s|$TRUSTED_IDENTITY|$rehearsal|" \
            "$RUNNER_TEMP/policy/verify-release-image.yaml"
          grep --fixed-strings "subject: $rehearsal" \
            "$RUNNER_TEMP/policy/verify-release-image.yaml"
          make admission-policy POLICY="$RUNNER_TEMP/policy"

      # Read from the cluster, not from what this workflow asked for.
      - name: Record what the cases run against
        run: |
          kubernetes="$(kubectl version --output json | jq --raw-output --exit-status \
            '"\(.serverVersion.gitVersion), with kubectl \(.clientVersion.gitVersion)"')"
          kyverno="$(kubectl --namespace kyverno get deployment kyverno-admission-controller \
            --output jsonpath='{.spec.template.spec.containers[0].image}')"
          chart="$(helm --namespace kyverno list --output json \
            | jq --raw-output --exit-status '.[0].chart')"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            policies="exactly as committed"
          else
            policies="as committed, except that on this rehearsal the image policy trusts \`https://github.com/$GITHUB_WORKFLOW_REF\`"
          fi
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Admission test

          - Image: \`$RELEASE\`
          - Cluster: $(kind version | cut -d ' ' -f 1-2), Kubernetes $kubernetes
          - Kyverno: \`$kyverno\`, installed from the chart \`$chart\`
          - Namespace and policies: \`policy/\` $policies

          EOF

      - name: Run the eight cases
        run: |
          make admission-cases RELEASE="$RELEASE" UNSIGNED="$UNSIGNED" \
            WRONG_SIGNER="$WRONG_SIGNER" NO_SBOM="$NO_SBOM"

      # The table has a row for every case, whether or not it went as
      # expected, so it is shown even when the step above has failed.
      - name: Summarise
        if: always()
        run: |
          if [ -f .cache/admission.md ]; then
            cat .cache/admission.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # For whoever has to find out why a case went wrong, and for whoever
      # wants to see Kyverno's side of a run that went right. The API server
      # passes on the message of the policy that refused a Pod; the last
      # command shows what Kyverno's verifier found wrong with each image.
      # Nothing here decides anything, so no command in it may fail the job.
      - name: Show the cluster's side
        if: always()
        run: |
          set +e
          kubectl get imagevalidatingpolicies,validatingpolicies
          kubectl get pods --all-namespaces --output wide
          kubectl --namespace apps get events --sort-by .lastTimestamp
          kubectl --namespace kyverno logs deployment/kyverno-admission-controller --tail 200
          kubectl --namespace kyverno logs deployment/kyverno-admission-controller \
            | grep "image verification failed"
          exit 0
