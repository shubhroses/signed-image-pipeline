# Fixtures for kyverno-test.yaml, each named after what it shows. The images
# are real and pinned by digest: the CLI reads their registries to judge them.
#
# This image is OUTSIDE_IMAGE of versions.env: public, in another registry,
# and signed by its publisher, the Kubernetes release team. Nothing attached
# to it names this repository's release workflow, so the policy has to refuse
# it.
apiVersion: v1
kind: Pod
metadata:
  name: image-from-another-registry
  namespace: apps
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10.1@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
---
# The nearest thing to a release that is not one. This image was built, signed
# and attested by release.yml of this repository, in a rehearsal on the branch
# wip/s7. It has the repository, the workflow file and the issuer of a
# release, a signature and an SBOM attestation. Only the ref in its
# certificate differs: refs/heads/wip/s7, where a release has refs/heads/main.
# A policy that trusted the workflow on every ref would accept it, so this is
# the fixture that tells "on main" from "on a branch".
#
# It dates from when a rehearsal still pushed to the package that holds the
# releases, which nothing prunes, so it stays. A rehearsal made today goes to
# the fixtures package and is pruned with the fixtures, so its image could
# not stand here for long. If this one is ever deleted, the CLI reports an
# error for this Pod, which is not the result expected here, and the test
# fails.
apiVersion: v1
kind: Pod
metadata:
  name: image-signed-on-a-branch
  namespace: apps
spec:
  containers:
    - name: app
      image: ghcr.io/shubhroses/signed-image-pipeline@sha256:37c28fd782d78ca023c903a115000a8f52eeef22d1cfa1f1adfc5e3ee0450803
---
# Every image of a Pod is checked, not only the first one. Here the container
# runs a release, the one built from commit 6989a71, and the init container
# runs the image from the other registry.
apiVersion: v1
kind: Pod
metadata:
  name: init-container-from-another-registry
  namespace: apps
spec:
  initContainers:
    - name: init
      image: registry.k8s.io/pause:3.10.1@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
  containers:
    - name: app
      image: ghcr.io/shubhroses/signed-image-pipeline@sha256:f2643461ef6f567aeaa387ef744d791ff02ace009495afc54969f7c02beee1dc
---
# The control for the Pod above. With the release in both places it passes, so
# what is refused above is the image and not the use of an init container.
apiVersion: v1
kind: Pod
metadata:
  name: release-in-init-container
  namespace: apps
spec:
  initContainers:
    - name: init
      image: ghcr.io/shubhroses/signed-image-pipeline@sha256:f2643461ef6f567aeaa387ef744d791ff02ace009495afc54969f7c02beee1dc
  containers:
    - name: app
      image: ghcr.io/shubhroses/signed-image-pipeline@sha256:f2643461ef6f567aeaa387ef744d791ff02ace009495afc54969f7c02beee1dc
---
# No ephemeral container can be added to a Pod in the namespace any more
# (no-ephemeral-containers.yaml), but a Pod may have been given one before
# that policy was there. The image policy reads its image too whenever such a
# Pod is updated. Here the container runs a release and the ephemeral
# container runs the image from the other registry.
apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-container-from-another-registry
  namespace: apps
spec:
  containers:
    - name: app
      image: ghcr.io/shubhroses/signed-image-pipeline@sha256:f2643461ef6f567aeaa387ef744d791ff02ace009495afc54969f7c02beee1dc
  ephemeralContainers:
    - name: debug
      image: registry.k8s.io/pause:3.10.1@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
